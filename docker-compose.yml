# ---------------------------------------------------------------------------
# SalaryTontine - pile complete pour un lancement local en une commande.
#   docker compose up --build
# Les valeurs proviennent du fichier .env (voir .env.example).
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    container_name: salarytontine-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-salarytontine}
      POSTGRES_USER: ${DB_USERNAME:-salarytontine}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est obligatoire}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-salarytontine} -d ${DB_NAME:-salarytontine}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - salarytontine-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: salarytontine-backend
    environment:
      # Le backend joint PostgreSQL par son nom de service sur le reseau interne.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-salarytontine}
      DB_USERNAME: ${DB_USERNAME:-salarytontine}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est obligatoire}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est obligatoire}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      APP_SEED_PASSWORD: ${APP_SEED_PASSWORD:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - salarytontine-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: salarytontine-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - salarytontine-net
    restart: unless-stopped

volumes:
  postgres-data:
    name: salarytontine-postgres-data

networks:
  salarytontine-net:
    name: salarytontine-net
    driver: bridge
