server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Application monopage : toute route inconnue est servie par index.html
    # afin que React Router prenne le relais cote client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers produits par Vite portent un hash de contenu :
    # ils peuvent etre mis en cache longuement.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
