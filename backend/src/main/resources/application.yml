spring:
  application:
    name: salary-tontine

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:salarytontine}
    username: ${DB_USERNAME:salarytontine}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Flyway est la seule source de verite du schema.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    cookie-name: ${JWT_COOKIE_NAME:salarytontine_token}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
  admin:
    # Compte administrateur initial, cree au demarrage si la base n'en a aucun.
    # Sans lui, une base vierge n'offrirait aucun moyen de se connecter.
    name: ${APP_ADMIN_NAME:Administrateur}
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
  rate-limit:
    # Limitation des points d'entrée publics d'authentification.
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    max-attempts: ${APP_RATE_LIMIT_MAX_ATTEMPTS:10}
    window-seconds: ${APP_RATE_LIMIT_WINDOW_SECONDS:60}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    password: ${APP_SEED_PASSWORD:}
  scheduling:
    # Traitement mensuel automatique des tontines actives.
    enabled: ${APP_SCHEDULING_ENABLED:true}
    # Passage quotidien : un mois deja traite est ignore, mais un serveur
    # arrete le 1er ne fait plus perdre le mois.
    monthly-run-cron: ${APP_MONTHLY_RUN_CRON:0 0 2 * * *}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.salarytontine: INFO
